name: Publish image

# Every push to main publishes a new version, so older builds stay pullable:
#   jncchds/debtbot:latest      newest build of main
#   jncchds/debtbot:1.0.<N>     N = workflow run number, one per build
#   jncchds/debtbot:sha-<short> the commit it was built from
# Pushing a git tag vX.Y.Z publishes X.Y.Z and X.Y instead (and doesn't move latest).
# Bump MAJOR_MINOR to start a new 1.x / 2.x line for main builds.

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]

env:
  IMAGE: jncchds/debtbot
  MAJOR_MINOR: "1.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Work out the version
      id: version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        else
          echo "version=${MAJOR_MINOR}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
        fi

    - name: Image tags and labels
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE }}
        flavor: latest=false
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
          type=sha,prefix=sha-,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
        labels: |
          org.opencontainers.image.version=${{ steps.version.outputs.version }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log into Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push multi-platform image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./DebtBot/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
          COMMIT=${{ github.sha }}

    - name: Summary
      run: |
        {
          echo "### Published ${{ steps.version.outputs.version }}"
          echo '```'
          echo "${{ steps.meta.outputs.tags }}"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
