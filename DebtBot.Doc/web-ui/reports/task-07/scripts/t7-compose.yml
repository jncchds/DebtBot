services:
  debtbot:
    image: debtbot-t7:local
    build:
      context: .
      dockerfile: DebtBot/Dockerfile
    ports: !override
      - '18097:8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DebtBot_DebtBot__JwtConfiguration__Key=T7RuntimeCheckKeyT7RuntimeCheckKeyT7RuntimeCheckKey123
      - DEFAULT_USER_TELEGRAM_ID=100001
      - DEFAULT_USER_TELEGRAM_USERNAME=@anna_p
  db:
    container_name: debtbot-t7-db
    volumes:
      - t7db:/var/lib/postgresql/data
  rabbit:
    container_name: debtbot-t7-rabbit
volumes:
  t7db:
