services:
  debtbot:
    image: debtbot-t7b:local
    build:
      context: .
      dockerfile: DebtBot/Dockerfile
    ports: !override
      - '18098:8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DebtBot_DebtBot__JwtConfiguration__Key=T7bRuntimeCheckKeyT7bRuntimeCheckKeyT7bRuntimeCheck12
      - DEFAULT_USER_TELEGRAM_ID=100001
      - DEFAULT_USER_TELEGRAM_USERNAME=@admin_dbt
  db:
    container_name: debtbot-t7b-db
    volumes:
      - t7bdb:/var/lib/postgresql/data
  rabbit:
    container_name: debtbot-t7b-rabbit
volumes:
  t7bdb:
