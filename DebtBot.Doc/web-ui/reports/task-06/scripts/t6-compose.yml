services:
  debtbot:
    image: debtbot-t6:local
    build:
      context: .
      dockerfile: DebtBot/Dockerfile
    ports: !override
      - '18096:8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DebtBot_DebtBot__JwtConfiguration__Key=T6RuntimeCheckKeyT6RuntimeCheckKeyT6RuntimeCheckKey123
      - DEFAULT_USER_TELEGRAM_ID=100001
      - DEFAULT_USER_TELEGRAM_USERNAME=@anna_p
  db:
    container_name: debtbot-t6-db
    volumes:
      - t6db:/var/lib/postgresql/data
  rabbit:
    container_name: debtbot-t6-rabbit
volumes:
  t6db:
