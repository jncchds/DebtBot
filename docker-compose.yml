version: '3.4'

services:
  debtbot:
    image: jncchds/debtbot:latest
    ports:
      - '8080:8080'
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      # You can specify both of these or just one of them, deleting the other:  
      - DEFAULT_USER_TELEGRAM_ID=123456789
      - DEFAULT_USER_TELEGRAM_USERNAME=@telegram_username 
      - DebtBot_Logging__LogLevel__Default=
      # Secret for signing sign-in tokens: a long random string (at least 32 characters), e.g. from `openssl rand -base64 48`.
      # Without it the public default from appsettings.json is used and anyone could forge tokens.
      # - DebtBot_DebtBot__JwtConfiguration__Key=CHANGE_ME_TO_A_LONG_RANDOM_SECRET
      # Telegram bot token. When empty, the bot doesn't run and Telegram sign-in on the web UI is hidden.
      # The Telegram Login Widget also needs the site's domain set on the bot in BotFather (/setdomain)
      # and the web UI served over HTTPS (refresh cookies are Secure outside Development).
      - DebtBot_DebtBot__Telegram__BotToken=
      - DebtBot_DebtBot__Telegram__LogBotToken=
      - DebtBot_DebtBot__Telegram__LogChatId=
      - DebtBot_DebtBot__Telegram__LogLevel__Default=
    # Start only when Postgres and RabbitMQ accept connections, so a cold `up` doesn't fail the migrations.
    depends_on:
      db:
        condition: service_healthy
      rabbit:
        condition: service_healthy

  db:
    image: postgres:14.1-alpine
    restart: always
    container_name: debtbot_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbit:
    image: rabbitmq:3
    restart: always
    container_name: debtbot_rabbit
    environment:
      - RABBITMQ_DEFAULT_USER=debtbot
      - RABBITMQ_DEFAULT_PASS=debtbot
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s